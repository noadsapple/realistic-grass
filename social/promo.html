<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Realistic Grass – square promo overlay (render source)</title>
<!--
  Transparent 1080x1080 overlay (texts, logo, ticker, van) laid over the lawn footage by
  social/render-promo.mjs. Driven by render(t); scene timing = social/timing-<lang>.json
  (same voice-over as the reels):
    v1 hook question · v2 "real-looking grass" · v3 benefits · v4 call to action.
  ?lang=en|es · &bg=<video url> + &play to preview over a video in a browser.
-->
<style>
  @font-face { font-family: "Anton"; src: url("../assets/fonts/anton-latin.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400 800; src: url("../assets/fonts/inter-latin-var.woff2") format("woff2"); }
  html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1080px; height: 1080px; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }
  #bgv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .abs { position: absolute; will-change: transform, opacity; }
  .grad-top { left: 0; top: 0; width: 1080px; height: 330px; background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,0)); }
  .grad-bot { left: 0; bottom: 0; width: 1080px; height: 460px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.62)); }
  #dim { inset: 0; background: rgba(4, 30, 14, .72); opacity: 0; }
  #badge { left: 34px; top: 26px; width: 150px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
  .display { font-family: "Anton", Impact, sans-serif; text-transform: uppercase; line-height: 1; text-shadow: 0 4px 0 rgba(0,0,0,.35), 0 6px 26px rgba(0,0,0,.85); }
  #hook { left: 0; width: 1080px; top: 250px; text-align: center; }
  #hook div { font-size: 104px; }
  #hook .y { color: #ffd60a; }
  #real { left: 60px; top: 610px; width: 960px; }
  #real .big { font-size: 86px; color: #a6e04a; }
  #real .sub { margin-top: 14px; display: inline-block; font-size: 38px; font-weight: 800; background: rgba(8,44,22,.85);
               padding: 10px 22px; border-radius: 12px; border-left: 8px solid #ffd60a; }
  #list { left: 60px; top: 250px; margin: 0; padding: 26px 34px; border-radius: 22px; background: rgba(8,44,22,.78);
          box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  #list li { list-style: none; display: flex; align-items: center; gap: 22px; font-family: "Anton", sans-serif; font-size: 62px;
             text-transform: uppercase; margin: 10px 0; will-change: transform, opacity; }
  #list li i { width: 68px; height: 68px; border-radius: 50%; background: #8cc63f; color: #0b2615; display: grid; place-items: center;
               flex-shrink: 0; font-style: normal; font-family: "Inter", sans-serif; font-weight: 900; font-size: 42px; }
  #list li.hl { color: #ffd60a; }
  #cta { left: 0; width: 1080px; top: 70px; text-align: center; }
  #cta img { width: 250px; filter: drop-shadow(0 12px 22px rgba(0,0,0,.5)); }
  #cta .pill { display: inline-block; margin-top: 8px; background: #ffd60a; color: #0b2615; font-family: "Anton", sans-serif; font-size: 62px;
               text-transform: uppercase; padding: 8px 44px 12px; border-radius: 999px; box-shadow: 0 12px 26px rgba(0,0,0,.4); }
  #cta .phone { font-family: "Anton", sans-serif; font-size: 128px; color: #ffd60a; margin-top: 14px; text-shadow: 0 10px 28px rgba(0,0,0,.6); }
  #cta .web { font-size: 42px; font-weight: 800; margin-top: 4px; }
  #cta .sub { font-size: 32px; font-weight: 600; color: #d8f0c0; margin-top: 10px; }
  #van { width: 330px; left: 0; top: 0; filter: drop-shadow(0 10px 12px rgba(0,0,0,.45)); }
  #ticker { left: 0; top: 1002px; width: 1080px; height: 78px; background: #ffd60a; overflow: hidden; box-shadow: 0 -6px 18px rgba(0,0,0,.35); }
  #ticker .track { position: absolute; top: 0; left: 0; white-space: nowrap; font-family: "Anton", sans-serif; font-size: 44px;
                   line-height: 78px; color: #0b2615; text-transform: uppercase; }
  #ticker b { color: #14612f; margin: 0 22px; font-weight: 400; }
</style>
</head>
<body>
<div id="stage">
  <video id="bgv" muted playsinline></video>
  <div class="abs grad-top"></div>
  <div class="abs grad-bot"></div>
  <div id="dim" class="abs"></div>
  <img id="badge" class="abs" src="../assets/logo-sm.webp" alt="">
  <div id="hook" class="abs display"></div>
  <div id="real" class="abs"><div class="big display"></div><div class="sub"></div></div>
  <ul id="list" class="abs"></ul>
  <div id="cta" class="abs"><img src="../assets/logo.webp" alt=""><br><div class="pill"></div>
    <div class="phone display">(786) 329-9117</div><div class="web">www.realisticgrass.com</div><div class="sub"></div></div>
  <img id="van" class="abs" src="../assets/van-right.webp" alt="">
  <div id="ticker" class="abs"><div class="track"></div></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const LANG = params.get("lang") === "es" ? "es" : "en";
const TXT = {
  en: { hook: ["Tired of", "mowing, watering", "<span class='y'>&amp; mud?</span>"],
        real: "Real-looking artificial grass", realSub: "Installed in Miami · Wholesale prices",
        list: ["Premium quality", "Maintenance-free", "Free estimate", "5-Year Limited Warranty"],
        pill: "Free Estimate", sub: "Call or text today · English & Español",
        ticker: ["Wholesale price", "Premium quality", "Maintenance-free", "Free estimate", "5-Year limited warranty", "Call (786) 329-9117"] },
  es: { hook: ["¿Cansado de", "cortar, regar", "<span class='y'>y el lodo?</span>"],
        real: "Grama artificial que parece real", realSub: "Instalada en Miami · Precios al por mayor",
        list: ["Calidad premium", "Sin mantenimiento", "Estimado gratis", "Garantía limitada 5 años"],
        pill: "Estimado Gratis", sub: "Llame o escriba hoy · Español & English",
        ticker: ["Precio al por mayor", "Calidad premium", "Sin mantenimiento", "Estimado gratis", "Garantía limitada de 5 años", "Llame al (786) 329-9117"] },
}[LANG];
document.documentElement.lang = LANG;
const $ = (id) => document.getElementById(id);
$("hook").innerHTML = TXT.hook.map((s) => `<div>${s}</div>`).join("");
document.querySelector("#real .big").textContent = TXT.real;
document.querySelector("#real .sub").textContent = TXT.realSub;
$("list").innerHTML = TXT.list.map((s, i) => `<li class="${i === 3 ? "hl" : ""}"><i>✓</i>${s}</li>`).join("");
document.querySelector("#cta .pill").textContent = TXT.pill;
document.querySelector("#cta .sub").textContent = TXT.sub;
const track = document.querySelector("#ticker .track");
const tickerUnit = TXT.ticker.map((s) => `${s}<b>★</b>`).join("");
track.innerHTML = tickerUnit.repeat(6);

let T = { v1: 0.35, hookEnd: 2.6, vanStart: 2.65, v2: 2.9, vanEnd: 7.4, listStart: 7.6, v3: 7.76, ctaStart: 12.4, v4: 12.7, duration: 18.6 };
window.setTiming = (t) => { T = { ...T, ...t }; window.DURATION = T.duration; };
window.DURATION = T.duration;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const backOut = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
let unitW = 0;

function render(t) {
  const cta = seg(t, T.ctaStart - 0.1, T.ctaStart + 0.5);

  // small logo badge (hidden when the big logo of the end card shows)
  $("badge").style.opacity = seg(t, 0.2, 0.6) * (1 - cta);
  $("badge").style.transform = `scale(${0.6 + 0.4 * backOut(seg(t, 0.2, 0.8))})`;

  // Hook question, word groups pop in with the voice
  document.querySelectorAll("#hook div").forEach((el, i) => {
    const a = backOut(seg(t, T.v1 + i * 0.45, T.v1 + 0.4 + i * 0.45));
    const o = seg(t, T.hookEnd - 0.3, T.hookEnd);
    el.style.opacity = clamp(a) * (1 - o);
    el.style.transform = `translateY(${(1 - clamp(a)) * 50}px) scale(${0.85 + 0.15 * a})`;
  });

  // "Real-looking artificial grass" lower third
  const r1 = easeOut(seg(t, T.v2, T.v2 + 0.5)), r2 = easeOut(seg(t, T.v2 + 1.3, T.v2 + 1.8));
  const ro = seg(t, T.vanEnd - 0.2, T.vanEnd + 0.2);
  document.querySelector("#real .big").style.cssText = `opacity:${r1 * (1 - ro)};transform:translateX(${(1 - r1) * -600}px)`;
  document.querySelector("#real .sub").style.cssText = `opacity:${r2 * (1 - ro)};transform:translateX(${(1 - r2) * -600}px)`;

  // Benefits panel, one line at a time across the third voice line
  const span = Math.max(2.4, T.ctaStart - T.v3 - 0.8);
  const lp = easeOut(seg(t, T.listStart, T.listStart + 0.4)), lo = seg(t, T.ctaStart - 0.35, T.ctaStart);
  $("list").style.opacity = lp * (1 - lo);
  $("list").style.transform = `translateX(${(1 - lp) * -80}px)`;
  document.querySelectorAll("#list li").forEach((el, i) => {
    const a = backOut(seg(t, T.v3 + (i * span) / 4, T.v3 + (i * span) / 4 + 0.45));
    el.style.opacity = clamp(a);
    el.style.transform = `translateX(${(1 - a) * -120}px)`;
  });

  // End card: darken the footage, big logo, offer and phone number
  $("dim").style.opacity = cta;
  const c = backOut(seg(t, T.ctaStart, T.ctaStart + 0.7));
  $("cta").style.opacity = seg(t, T.ctaStart, T.ctaStart + 0.3);
  $("cta").style.transform = `scale(${0.75 + 0.25 * c})`;
  const pulse = t > T.v4 + 0.8 ? 1 + 0.04 * Math.max(0, Math.sin((t - T.v4) * 5)) : 1;
  document.querySelector("#cta .phone").style.transform = `scale(${pulse})`;

  // Van drives in and parks bottom-right on the end card
  const vIn = easeOut(seg(t, T.ctaStart + 0.2, T.ctaStart + 1.5));
  const vx = -360 + vIn * (1080 - 330 - 20 + 360), vy = 1002 - 165 + (vIn < 1 ? Math.sin(t * 38) * 2 : 0);
  $("van").style.opacity = t > T.ctaStart ? 1 : 0;
  $("van").style.transform = `translate(${vx}px, ${vy}px)`;

  // Ticker: slides up, then scrolls continuously
  if (!unitW) unitW = track.scrollWidth / 6;
  const tk = easeOut(seg(t, 0.4, 0.9));
  $("ticker").style.transform = `translateY(${(1 - tk) * 90}px)`;
  track.style.transform = `translateX(${-((t * 150) % unitW)}px)`;
}

window.READY = Promise.all([document.fonts.ready, ...[...document.images].map((im) => im.decode().catch(() => {}))])
  .then(() => { render(0); return true; });
window.render = render;

if (params.has("play")) {                      // browser preview, optionally over a video
  const v = $("bgv");
  if (params.get("bg")) { v.src = params.get("bg"); v.style.display = "block"; v.loop = true; v.play(); }
  window.READY.then(() => { const t0 = performance.now();
    const loop = (now) => { render(((now - t0) / 1000) % T.duration); requestAnimationFrame(loop); };
    requestAnimationFrame(loop); });
}
</script>
</body>
</html>
